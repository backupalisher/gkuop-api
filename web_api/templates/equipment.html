<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аппараты — ГКУ ОП</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/main.css?v={{ static_version }}">
    <script src="/static/js/auth.js?v={{ static_version }}"></script>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="header-left">
                <h1 class="header-title">ГКУ ОП <span>Аппараты</span></h1>
            </div>
            <div class="header-right">
                <a href="/" class="btn btn-ghost">К заявкам</a>
            </div>
        </div>
    </div>

    <main class="page" style="padding: 16px; max-width: 1100px; margin: 0 auto;">
        <div id="accessDenied" class="card" style="display:none">
            <p>Справочник аппаратов изменяет только администратор.</p>
            <a href="/">Вернуться к заявкам</a>
        </div>

        <div id="catalogApp" style="display:none">
            <div class="card" style="margin-bottom: 16px;">
                <h2 id="formTitle">Новый аппарат</h2>
                <form id="equipmentForm" class="form-grid" style="display:grid; gap:10px;">
                    <input type="hidden" id="equipmentId" />
                    <label>Модель
                        <input class="input" id="modelInput" required maxlength="300" />
                    </label>
                    <label>Серийный номер
                        <input class="input" id="serialInput" required maxlength="100" />
                    </label>
                    <label>Инвентарный номер
                        <input class="input" id="inventoryInput" maxlength="50" placeholder="Необязательно, от 4 цифр" />
                    </label>
                    <div style="display:flex; gap:8px;">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Добавить</button>
                        <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none">Отмена</button>
                    </div>
                    <div id="formError" style="color:#c62828"></div>
                </form>
            </div>

            <div class="filters" style="margin-bottom: 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input class="input" id="searchInput" placeholder="Поиск: модель, серийный, инвентарный" style="flex:1; min-width:220px;" />
                <button type="button" class="btn btn-ghost" id="importCatalogBtn" title="Перезагрузить data/equipment_catalog.xlsx">
                    Обновить из xlsx
                </button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Аппарат</th>
                            <th>Серийный</th>
                            <th>Инвентарный</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="equipmentBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        async function api(url, options = {}) {
            const headers = AUTH.authHeaders({ 'Content-Type': 'application/json' });
            const response = await fetch(url, { ...options, headers });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || 'Ошибка запроса');
            }
            return data;
        }

        let searchTimer = null;

        async function loadEquipment() {
            const search = document.getElementById('searchInput').value.trim();
            const params = new URLSearchParams();
            if (search) params.set('search', search);
            const data = await api('/api/equipment?' + params.toString());
            const body = document.getElementById('equipmentBody');
            const rows = data.equipment || [];
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="4" class="empty">Аппараты не найдены</td></tr>';
                return;
            }
            body.innerHTML = rows.map((item) => `
                <tr>
                    <td>${escapeHtml(item.model)}</td>
                    <td>${escapeHtml(item.serial_number)}</td>
                    <td>${escapeHtml(item.inventory_number || '—')}</td>
                    <td><button type="button" class="btn btn-ghost btn-sm" data-edit="${item.id}">Изменить</button></td>
                </tr>
            `).join('');
            body.querySelectorAll('[data-edit]').forEach((button) => {
                button.onclick = () => beginEdit(rows.find((row) => String(row.id) === button.dataset.edit));
            });
        }

        function beginEdit(item) {
            if (!item) return;
            document.getElementById('equipmentId').value = item.id;
            document.getElementById('modelInput').value = item.model || '';
            document.getElementById('serialInput').value = item.serial_number || '';
            document.getElementById('inventoryInput').value = item.inventory_number || '';
            document.getElementById('formTitle').textContent = 'Изменить аппарат';
            document.getElementById('saveBtn').textContent = 'Сохранить';
            document.getElementById('cancelEditBtn').style.display = '';
            document.getElementById('formError').textContent = '';
        }

        function resetForm() {
            document.getElementById('equipmentForm').reset();
            document.getElementById('equipmentId').value = '';
            document.getElementById('formTitle').textContent = 'Новый аппарат';
            document.getElementById('saveBtn').textContent = 'Добавить';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('formError').textContent = '';
        }

        document.getElementById('cancelEditBtn').onclick = resetForm;
        document.getElementById('importCatalogBtn').onclick = async () => {
            const errorBox = document.getElementById('formError');
            errorBox.textContent = '';
            if (!confirm('Заменить весь справочник аппаратов из equipment_catalog.xlsx и пересвязать заявки?')) {
                return;
            }
            try {
                const result = await api('/api/equipment/import-catalog', { method: 'POST' });
                errorBox.style.color = '#2e7d32';
                errorBox.textContent =
                    `Импортировано: ${result.imported || 0}, пересвязано заявок: ${result.relinked || 0}`;
                await loadEquipment();
            } catch (error) {
                errorBox.style.color = '#c62828';
                errorBox.textContent = error.message;
            }
        };
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                loadEquipment().catch((error) => {
                    document.getElementById('formError').textContent = error.message;
                });
            }, 250);
        });
        document.getElementById('equipmentForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const errorBox = document.getElementById('formError');
            errorBox.textContent = '';
            const payload = {
                model: document.getElementById('modelInput').value,
                serial_number: document.getElementById('serialInput').value,
                inventory_number: document.getElementById('inventoryInput').value,
            };
            const equipmentId = document.getElementById('equipmentId').value;
            try {
                if (equipmentId) {
                    await api('/api/equipment/' + equipmentId, {
                        method: 'PUT',
                        body: JSON.stringify(payload),
                    });
                } else {
                    await api('/api/equipment', {
                        method: 'POST',
                        body: JSON.stringify(payload),
                    });
                }
                resetForm();
                await loadEquipment();
            } catch (error) {
                errorBox.textContent = error.message;
            }
        });

        AUTH.init();
        if (!AUTH.isAuthenticated()) {
            window.location.href = '/';
        } else if (AUTH.getRole() !== 'admin') {
            document.getElementById('accessDenied').style.display = 'block';
        } else {
            document.getElementById('catalogApp').style.display = 'block';
            loadEquipment().catch((error) => {
                document.getElementById('formError').textContent = error.message;
            });
        }
    </script>
</body>
</html>
